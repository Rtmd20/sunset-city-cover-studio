<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset City Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="panel" aria-label="Cover editor">
    <h1>Sunset City Cover Studio</h1>
    <p class="lede">One photo and a caption, made into a GTA-style poster cover. Everything runs offline, on your own machine.</p>

    <label class="field">Your photo
      <input id="photo" type="file" accept="image/*">
    </label>
    <label class="field">Second photo (optional)
      <input id="photo2" type="file" accept="image/*">
    </label>
    <div class="row">
      <button id="sample-pier" type="button">Try sample: Pier</button>
      <button id="sample-boulevard" type="button">Try sample: Boulevard</button>
    </div>
    <button id="make-poster" type="button" class="primary">Make it a poster — one click</button>

    <label class="field">Title
      <input id="title" type="text" maxlength="30" value="Sundown Racket">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" maxlength="40" value="Paid in Sunsets">
    </label>
    <label class="field">Press quote
      <input id="quote" type="text" maxlength="60" value="The most fun you can have with one photo.">
    </label>
    <label class="field">Paper name
      <input id="paper" type="text" maxlength="30" value="Sunset City Gazette">
    </label>
    <label class="field">Volume badge
      <input id="vol" type="text" maxlength="12" value="VOL. 6">
    </label>

    <fieldset>
      <legend>Colour grade</legend>
      <label class="choice"><input type="radio" name="grade" value="sunset" checked> Sunset</label>
      <label class="choice"><input type="radio" name="grade" value="neon"> Neon Pink</label>
      <label class="choice"><input type="radio" name="grade" value="teal"> Vice Teal</label>
      <label class="choice"><input type="radio" name="grade" value="golden"> Golden Hour</label>
      <label class="choice"><input type="radio" name="grade" value="night"> Night Drive</label>
      <label class="choice"><input type="radio" name="grade" value="chrome"> Palm Chrome</label>
    </fieldset>

    <fieldset>
      <legend>Title layout</legend>
      <label class="choice"><input type="radio" name="layout" value="over" checked> Title over the art</label>
      <label class="choice"><input type="radio" name="layout" value="below"> Title below the art</label>
    </fieldset>

    <fieldset>
      <legend>Crop a panel</legend>
      <div id="panels" class="row">
        <button type="button">Hero</button>
        <button type="button">Tall</button>
        <button type="button">Wide</button>
        <button type="button">Slanted</button>
        <button type="button">Small</button>
      </div>
      <label class="field">Role label
        <input id="role" type="text" maxlength="14" value="THE DRIVER">
      </label>
      <label class="field">Zoom
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1.15">
        <span id="zoomval">115%</span>
      </label>
      <label class="field">Move sideways
        <input id="offx" type="range" min="-1" max="1" step="0.05" value="0">
      </label>
      <label class="field">Move up / down
        <input id="offy" type="range" min="-1" max="1" step="0.05" value="0">
      </label>
      <p class="hint">The hero crop has a headroom guard: it never cuts the top of the head off, however you move it.</p>
    </fieldset>

    <div class="row">
      <button id="export-square" type="button">Export 1080 × 1080</button>
      <button id="export-portrait" type="button">Export 1080 × 1350</button>
      <button id="export-wide" type="button">Export 1920 × 1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="Live preview of the cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
